org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Equipo de desarrollo: 7 GB de RAM. Con el emulador (1,5 GB) y Android Studio
# (1,2 GB) abiertos no queda margen para un daemon de Kotlin sin límite: el
# compilador muere y el build falla con "Internal compiler error" en
# kaptGenerateStubsDebugKotlin. Los topes de abajo mantienen el build dentro de
# ~3,3 GB en total.
kotlin.daemon.jvmargs=-Xmx1280m
org.gradle.workers.max=4

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
